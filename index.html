<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Весільний альбом Viacheslav та Diana — 03 жовтня 2026 року.">
    <title>Весільний альбом — Viacheslav &amp; Diana</title>
    <link rel="icon" href="assets/logo_2.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;1,200;1,700&amp;family=Monsieur+La+Doulaise&amp;display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <section class="hero" aria-labelledby="couple-names">
            <img class="hero__decoration hero__decoration--top"
                src="assets/logo_1.webp" alt="" width="512" height="325" decoding="async">
            <div class="hero__content">
                <p class="hero__subtitle">весільний альбом</p>
                <h1 class="hero__names" id="couple-names">
                    <span>Viacheslav &amp;</span>
                    <span>Diana</span>
                </h1>
                <time class="hero__date" datetime="2026-10-03">03/10/2026</time>
                <button class="hero__button" id="open-upload-modal" type="button"
                    aria-haspopup="dialog" aria-controls="upload-modal" disabled>
                    додати фото
                </button>
                <noscript><p>Щоб вибрати фото, увімкніть JavaScript у браузері.</p></noscript>
            </div>
            <img class="hero__decoration hero__decoration--bottom"
                src="assets/logo_2.webp" alt="" width="296" height="438" decoding="async">
        </section>

        <section class="gallery" id="gallery" aria-labelledby="gallery-title">
            <h2 class="visually-hidden" id="gallery-title">Весільні фотографії</h2>
            <div class="gallery__grid">
                <img src="photo/optimized/1-960.webp" srcset="photo/optimized/1-480.webp 480w, photo/optimized/1-960.webp 960w" sizes="(min-width: 1232px) 596px, calc((100vw - 40px) / 2)" width="960" height="1280" loading="lazy" decoding="async" alt="Весільна фотографія 1">
                <img src="photo/optimized/2-960.webp" srcset="photo/optimized/2-480.webp 480w, photo/optimized/2-960.webp 960w" sizes="(min-width: 1232px) 596px, calc((100vw - 40px) / 2)" width="960" height="1280" loading="lazy" decoding="async" alt="Весільна фотографія 2">
                <img src="photo/optimized/3-960.webp" srcset="photo/optimized/3-480.webp 480w, photo/optimized/3-960.webp 960w" sizes="(min-width: 1232px) 596px, calc((100vw - 40px) / 2)" width="960" height="1280" loading="lazy" decoding="async" alt="Весільна фотографія 3">
                <img src="photo/optimized/8-960.webp" srcset="photo/optimized/8-480.webp 480w, photo/optimized/8-960.webp 960w" sizes="(min-width: 1232px) 596px, calc((100vw - 40px) / 2)" width="960" height="983" loading="lazy" decoding="async" alt="Весільна фотографія 4">
                <img src="photo/optimized/5-960.webp" srcset="photo/optimized/5-480.webp 480w, photo/optimized/5-960.webp 960w" sizes="(min-width: 1232px) 596px, calc((100vw - 40px) / 2)" width="960" height="1280" loading="lazy" decoding="async" alt="Весільна фотографія 5">
                <img src="photo/optimized/7-960.webp" srcset="photo/optimized/7-480.webp 480w, photo/optimized/7-960.webp 960w" sizes="(min-width: 1232px) 596px, calc((100vw - 40px) / 2)" width="960" height="1280" loading="lazy" decoding="async" alt="Весільна фотографія 6">
                <img src="photo/optimized/9-960.webp" srcset="photo/optimized/9-480.webp 480w, photo/optimized/9-960.webp 960w" sizes="(min-width: 1232px) 596px, calc((100vw - 40px) / 2)" width="960" height="609" loading="lazy" decoding="async" alt="Весільна фотографія 7">
                <img src="photo/optimized/5-960.webp" srcset="photo/optimized/5-480.webp 480w, photo/optimized/5-960.webp 960w" sizes="(min-width: 1232px) 596px, calc((100vw - 40px) / 2)" width="960" height="1280" loading="lazy" decoding="async" alt="Весільна фотографія 5">
                <img src="photo/optimized/7-960.webp" srcset="photo/optimized/7-480.webp 480w, photo/optimized/7-960.webp 960w" sizes="(min-width: 1232px) 596px, calc((100vw - 40px) / 2)" width="960" height="1280" loading="lazy" decoding="async" alt="Весільна фотографія 6">
            </div>
        </section>
    </main>

    <dialog class="modal" id="upload-modal" aria-labelledby="upload-modal-title">
        <div class="modal__overlay" data-close-modal aria-hidden="true"></div>
        <div class="modal__sheet">
            <h2 class="visually-hidden" id="upload-modal-title">Додати фотографії</h2>
            <button class="modal__close" type="button" aria-label="Закрити вікно" data-close-modal autofocus>&times;</button>
            <div class="modal__content">
                <form class="upload-form" id="upload-form">
                    <fieldset class="upload-mode">
                        <legend class="upload-mode__legend">Режим додавання фото</legend>
                        <input class="upload-mode__input" id="upload-mode-standard" type="radio" name="uploadMode" value="standard" checked>
                        <label class="upload-mode__label" for="upload-mode-standard">звичайний</label>
                        <input class="upload-mode__input" id="upload-mode-advanced" type="radio" name="uploadMode" value="advanced">
                        <label class="upload-mode__label" for="upload-mode-advanced">розширений</label>
                        <span class="upload-mode__indicator" aria-hidden="true"></span>
                    </fieldset>

                    <div class="photo-picker">
                        <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,.jpg,.jpeg,.png,.webp,.gif,.avif" multiple hidden>
                        <div class="photo-picker__area" id="photo-picker-area">
                            <div class="photo-picker__selection">
                                <button class="photo-picker__placeholder" id="photo-placeholder" type="button" aria-describedby="photo-hint photo-error">
                                    <img class="photo-picker__icon_empty" src="assets/empty_photo.webp" alt="" width="614" height="128" loading="lazy" decoding="async">
                                    <span class="photo-picker__text_title">натисніть, щоб додати фото</span>
                                    <span class="photo-picker__text_subtitle" id="photo-hint">до 12 фото, максимум 10 МБ кожне</span>
                                </button>
                                <div class="photo-preview" id="photo-preview" aria-label="Вибрані фотографії"></div>
                                <div class="photo__count" id="photo-count" role="status" aria-live="polite" hidden></div>
                            </div>
                            <fieldset class="photo-styles" id="photo-styles" hidden disabled>
                                <legend class="upload-mode__legend">Стиль фото</legend>
                                <input class="upload-mode__input" id="style-mafia" type="radio" name="photoStyle" value="mafia" checked>
                                <label class="photo-styles__label" for="style-mafia">Wedding Mafia</label>
                                <input class="upload-mode__input" id="style-cartoon" type="radio" name="photoStyle" value="cartoon">
                                <label class="photo-styles__label" for="style-cartoon">мультвесілля</label>
                                <input class="upload-mode__input" id="style-royal" type="radio" name="photoStyle" value="royal">
                                <label class="photo-styles__label" for="style-royal">корони &amp; келихи</label>
                                <input class="upload-mode__input" id="style-disco" type="radio" name="photoStyle" value="disco">
                                <label class="photo-styles__label" for="style-disco">диско 80-х</label>
                                <span class="photo-styles__indicator" aria-hidden="true"></span>
                            </fieldset>
                        </div>
                        <p class="photo-error" id="photo-error" role="alert" aria-atomic="true"></p>
                    </div>

                    <label class="anonymous-switch">
                        <input class="anonymous-switch__input" id="anonymous-checkbox" name="anonymous" type="checkbox">
                        <span class="anonymous-switch__control" aria-hidden="true"></span>
                        <span class="anonymous-switch__text">Додати анонімно</span>
                    </label>
                    <div class="upload-form__field" id="name-field">
                        <label class="visually-hidden" for="guest-name">Ваше ім’я</label>
                        <input class="upload-form__input" id="guest-name" name="guestName" type="text"
                            placeholder="Введіть ваше ім’я" autocomplete="name" maxlength="100">
                    </div>
                    <p class="upload-form__notice" id="upload-notice">Поки доступний лише попередній перегляд. Фото не зберігаються в альбомі, а стилізація ще недоступна.</p>
                    <button class="upload-form__submit" type="submit" aria-describedby="upload-notice">завантажити</button>
                    <p class="upload-form__status" id="upload-status" role="status" aria-live="polite" aria-atomic="true"></p>
                </form>
            </div>
        </div>
    </dialog>
</body>
</html>
