<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Весільний альбом</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <section class="hero">
            <img
                class="hero__decoration hero__decoration--top"
                src="assets/logo_1.png"
                alt=""
            >

            <div class="hero__content">
                <p class="hero__subtitle">весільний альбом</p>

                <h1 class="hero__names">
                    <span>Viacheslav &amp;</span>
                    <span>Diana</span>
                </h1>

                <time class="hero__date" datetime="2026-10-03">
                    03/10/2026
                </time>

                <button
                    class="hero__button"
                    id="open-upload-modal"
                    type="button"
                >
                    додати фото
                </button>
            </div>

            <img
                class="hero__decoration hero__decoration--bottom"
                src="assets/logo_2.png"
                alt=""
            >
        </section>

        <section class="gallery" id="gallery">


            <div class="gallery__grid">
                <img src="photo/1.JPG" alt="Весільна фотографія">
                <img src="photo/2.JPG" alt="Весільна фотографія">
                <img src="photo/3.JPG" alt="Весільна фотографія">
                <img src="photo/8.JPG" alt="Весільна фотографія">
                <img src="photo/5.JPG" alt="Весільна фотографія">
                <img src="photo/7.JPG" alt="Весільна фотографія">
                <img src="photo/9.png" alt="Весільна фотографія">
                <img src="photo/5.JPG" alt="Весільна фотографія">
                <img src="photo/7.JPG" alt="Весільна фотографія">
            </div>

    </main>


    <div class="modal" id="upload-modal" aria-hidden="true">

        <div class="modal__overlay" data-close-modal></div>



        <section
            class="modal__sheet"
            role="dialog"
            aria-modal="true"
            aria-labelledby="upload-modal-title"
            >

            <button
                class="modal__close"
                type="button"
                aria-label="Закрити вікно"
                data-close-modal
            >
                &times;
            </button>

            <fieldset class="upload-mode">
            <legend class="upload-mode__legend">Режим додавання фото</legend>
            <input class="upload-mode__input" id="upload-mode-standard" type="radio" name="uploadMode" value="standard" checked>
            <label class="upload-mode__label" for="upload-mode-standard">звичайний</label>
            <input class="upload-mode__input" id="upload-mode-advanced" type="radio" name="uploadMode" value="advanced">
            <label class="upload-mode__label" for="upload-mode-advanced">продвинутий</label>
            <span class="upload-mode__indicator" aria-hidden="true"></span>
            </fieldset>

            <div class="modal__content">

                <form class="upload-form" id="upload-form">

                    <div class="photo-picker">

                        <input
                            id="photo-input"
                            type="file"
                            accept="image/*"
                            multiple
                            hidden
                        >

                        <div class="photo-picker__area" id="photo-picker-area">

                            <div class="photo-picker__placeholder" id="photo-placeholder">
                            <img class="photo-picker__icon_empty" src="assets/empty_photo.png" alt="">
                            
                            <span class="photo-picker__text_title">натисність, щоб додати фото</span>
                            <span class="photo-picker__text_subtitle">максимальний розмір - 10Mb</span>

                            </div>


                            <div class="photo-preview" id="photo-preview"></div>


                            <div class="photo__count" id="photo-count">
                           
                            </div>

                        </div>

                        <div id="photo-error"></div>

                    </div>




                    <label class="anonymous-switch">
                        <input
                            class="anonymous-switch__input"
                            id="anonymous-checkbox"
                            name="anonymous"
                            type="checkbox"
                        >

                        <span class="anonymous-switch__control"></span>
                        <span class="anonymous-switch__text">Додати анонімно</span>
                    </label>


                    <div class="upload-form__field" id="name-field">

                        <input
                            class="upload-form__input"
                            id="guest-name"
                            name="guestName"
                            type="text"
                            placeholder="Введіть ваше ім’я"
                            autocomplete="name"
                        >
                    </div>



                    <button class="upload-form__submit" type="submit">
                        завантажити
                    </button>

                </form>
            </div>
        
        </section>
    
    </div>

<script src="script.js"></script>
</body>
</html>
