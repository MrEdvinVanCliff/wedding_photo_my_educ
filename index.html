<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Весільний альбом</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <section class="hero">
            <img
                class="hero__decoration hero__decoration--top"
                src="assets/logo_1.png"
                alt=""
            >

            <div class="hero__content">
                <p class="hero__subtitle">весільний альбом</p>

                <h1 class="hero__names">
                    <span>Viacheslav &amp;</span>
                    <span>Diana</span>
                </h1>

                <time class="hero__date" datetime="2026-10-03">
                    03/10/2026
                </time>

                <button
                    class="hero__button"
                    id="open-upload-modal"
                    type="button"
                >
                    додати фото
                </button>
            </div>

            <img
                class="hero__decoration hero__decoration--bottom"
                src="assets/logo_2.png"
                alt=""
            >
        </section>
    </main>


    <div class="modal" id="upload-modal" aria-hidden="true">

        <div class="modal__overlay" data-close-modal></div>

        <section
            class="modal__sheet"
            role="dialog"
            aria-modal="true"
            aria-labelledby="upload-modal-title"
            >

            <button
                class="modal__close"
                type="button"
                aria-label="Закрити вікно"
                data-close-modal
            >
                &times;
            </button>

            <h2 class="modal__title" id="upload-modal-title">
                Додати фото
            </h2>

            <div class="modal__content">

                <form class="upload-form" id="upload-form">
                    <div class="upload-form__field" id="name-field">
                        <label class="upload-form__label" for="guest-name">
                            Ваше ім’я
                        </label>

                        <input
                            class="upload-form__input"
                            id="guest-name"
                            name="guestName"
                            type="text"
                            placeholder="Введіть ваше ім’я"
                            autocomplete="name"
                        >
                    </div>

                    <label class="anonymous-switch">
                        <input
                            class="anonymous-switch__input"
                            id="anonymous-checkbox"
                            name="anonymous"
                            type="checkbox"
                        >

                        <span class="anonymous-switch__control"></span>
                        <span class="anonymous-switch__text">Додати анонімно</span>
                    </label>

                    <div class="photo-picker">
                        <input
                            class="photo-picker__input"
                            id="photo-input"
                            name="photos"
                            type="file"
                            accept="image/*"
                            multiple
                        >

                        <label class="photo-picker__empty" for="photo-input">
                            <span class="photo-picker__icon">＋</span>
                            <span class="photo-picker__text">Додати фотографії</span>
                        </label>

                        <div
                            class="photo-picker__preview"
                            id="photo-preview"
                            aria-live="polite"
                        ></div>
                    </div>

                    <button class="upload-form__submit" type="submit">
                        Завантажити
                    </button>
                </form>
            </div>
        
        </section>
    
    </div>

<script src="script.js"></script>
</body>
</html>
